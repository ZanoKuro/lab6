# Redis Custom Configuration for Bee Queue
# ============================================
# File này cấu hình Redis để hỗ trợ message persistence
# Bee Queue lưu job data trong Redis — cần đảm bảo data không mất khi Redis restart

# ── Persistence: AOF (Append Only File) ──────────────────────────────────────
# Bật AOF để ghi lại mọi write operation vào disk
# Khi Redis restart, nó sẽ replay AOF file để khôi phục data
appendonly yes

# Flush AOF ra disk mỗi giây — cân bằng giữa performance và durability
# Các option: always (mỗi write), everysec (mỗi giây), no (để OS quyết định)
appendfsync everysec

# ── Memory Policy ────────────────────────────────────────────────────────────
# Không tự động xoá key khi hết memory — quan trọng cho job queue
maxmemory-policy noeviction

# ── Performance ──────────────────────────────────────────────────────────────
# Tắt RDB snapshot (đã dùng AOF rồi, không cần cả 2)
save ""

# Log level
loglevel notice
