services:
  # ── Message Broker + Job Store ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: eda-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Producer (Order Service) ───────────────────────────────────────────────
  order_service:
    build: ./order_service
    container_name: eda-order-service
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379

  # ── Workers ────────────────────────────────────────────────────────────────
  inventory_service:
    build: ./inventory_service
    container_name: eda-inventory-service
    depends_on:
      redis:
        condition: service_healthy
      order_service:
        condition: service_started
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - IS_WORKER=true
      - ORDER_SERVICE_URL=http://order_service:8000

  notification_service:
    build: ./notification_service
    container_name: eda-notification-service
    depends_on:
      redis:
        condition: service_healthy
      order_service:
        condition: service_started
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - IS_WORKER=true
      - ORDER_SERVICE_URL=http://order_service:8000

  analytics_service:
    build: ./analytics_service
    container_name: eda-analytics-service
    depends_on:
      redis:
        condition: service_healthy
      order_service:
        condition: service_started
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - IS_WORKER=true
      - ORDER_SERVICE_URL=http://order_service:8000

volumes:
  redis_data:
